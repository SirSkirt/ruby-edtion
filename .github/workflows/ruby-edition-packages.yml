name: Ruby Edition game packages
on:
  push:
    branches: [main, nightly]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ruby-edition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            ext: ''
          - os: windows-latest
            label: windows-x64
            ext: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ruby-edition-${{ matrix.label }}
      - name: Linux audio and controller headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Build game, preparation helper, and command tool
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --profile fast -p horizon-client --bin horizon-client --bin horizon-ctl -p horizon-prepare --bin horizon-prepare
      - name: Package compiled binaries and original Horizon preparation sources
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p package/ruby-edition/crates/horizon-prepare package/ruby-edition/mods/horizon/src/test
          for name in horizon-client horizon-ctl horizon-prepare; do
            cp "target/fast/$name$EXT" "package/ruby-edition/$name$EXT"
          done
          cp research-lock.json package/ruby-edition/
          cp -R crates/horizon-prepare/src package/ruby-edition/crates/horizon-prepare/
          cp -R mods/horizon/src/test/java package/ruby-edition/mods/horizon/src/test/
          python - <<'PY'
          import json, os
          with open('research-lock.json') as f: lock = json.load(f)
          with open('package/ruby-edition/ruby-edition-build.json', 'w') as f:
              json.dump({'channel': os.environ['GITHUB_REF_NAME'], 'commit': os.environ['GITHUB_SHA'],
                         'minecraft_version': lock['minecraft']['version']}, f, indent=2)
          PY
          cd package
          python -m zipfile -c "../ruby-edition-$LABEL.zip" ruby-edition
      - uses: actions/upload-artifact@v4
        with:
          name: ruby-edition-${{ matrix.label }}
          path: ruby-edition-${{ matrix.label }}.zip
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish ${{ github.ref_name }} release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || github.ref_name == 'nightly'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ruby-edition-*
          path: dist
          merge-multiple: true
      - name: Create checksums and immutable tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum ruby-edition-linux-x86_64.zip ruby-edition-windows-x64.zip > SHA256SUMS
          short="${GITHUB_SHA:0:8}"
          tag="ruby-edition-${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}-$short"
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == nightly ]]; then prerelease+=(--prerelease --latest=false); fi
          gh release create "$tag" ruby-edition-linux-x86_64.zip ruby-edition-windows-x64.zip SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Ruby Edition ${GITHUB_REF_NAME} · $short" \
            --notes "Community Rust game build. Requires an owned Minecraft Java Edition 26.3 installation. Minecraft assets are not redistributed." \
            "${prerelease[@]}"
